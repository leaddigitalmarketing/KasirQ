<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kasir AZMA TRANSFER</title>
<style>
body { font-family: Arial, sans-serif; background:#f4f6f8; margin:0; padding:10px;}
.header { text-align:center; margin-bottom:10px; }
.logo { font-size:22px; font-weight:bold; color:#0d6efd; }
.subtitle { font-size:13px; color:#555; }
.card { background:#fff; padding:15px; margin-bottom:10px; border-radius:8px; }
input, select, button {
  width:100%; padding:10px; margin-top:5px; margin-bottom:10px;
  font-size:16px;
}
button { background:#0d6efd; color:#fff; border:none; border-radius:5px; }
button.export { background:#198754; }
.small { font-size:13px; color:#444; }
hr { border:none; border-top:1px solid #ddd; }
</style>
</head>
<body>

<div class="header">
  <div class="logo">AZMA TRANSFER</div>
  <div class="subtitle">Transfer • Tarik Tunai • E-Wallet</div>
</div>

<div class="card">
<h3>Saldo Awal</h3>
<input id="bri" placeholder="Saldo BRI">
<input id="bca" placeholder="Saldo BCA">
<input id="superbank" placeholder="Saldo Superbank">
<input id="seabank" placeholder="Saldo Seabank">
<input id="pulsa" placeholder="Saldo APK Pulsa">
<input id="cash" placeholder="Uang Cash">
<button onclick="simpanSaldo()">Simpan Saldo</button>
</div>

<div class="card">
<h3>Input Transaksi</h3>

<select id="jenis">
  <option value="transfer">Transfer</option>
  <option value="tarik">Tarik Tunai</option>
</select>

<select id="sumber">
  <option value="bri">BRI</option>
  <option value="bca">BCA</option>
  <option value="superbank">Superbank</option>
  <option value="seabank">Seabank</option>
  <option value="pulsa">APK Pulsa</option>
  <option value="cash">Cash</option>
</select>

<input id="nominal" type="number" placeholder="Nominal Transaksi">

<button onclick="proses()">Proses Transaksi</button>
<p class="small" id="hasil"></p>
</div>

<div class="card">
<h3>Rekap Hari Ini</h3>
<p class="small" id="rekap"></p>
<button class="export" onclick="exportCSV()">Export Excel</button>
</div>

<div class="card">
<h3>Riwayat Transaksi</h3>
<div id="riwayat"></div>
</div>

<script>
let saldo = JSON.parse(localStorage.getItem("saldo")) || {
  bri:0,bca:0,superbank:0,seabank:0,pulsa:0,cash:0
};
let data = JSON.parse(localStorage.getItem("data")) || [];

function fee(n){
  if(n < 1000000) return 5000;
  if(n <= 3000000) return 10000;
  if(n <= 6000000) return 15000;
  if(n <= 10000000) return 20000;
  if(n <= 15000000) return 25000;
  if(n <= 25000000) return 35000;
  return 50000;
}

function simpanSaldo(){
  saldo.bri=+bri.value; saldo.bca=+bca.value;
  saldo.superbank=+superbank.value; saldo.seabank=+seabank.value;
  saldo.pulsa=+pulsa.value; saldo.cash=+cash.value;
  localStorage.setItem("saldo",JSON.stringify(saldo));
  alert("Saldo disimpan");
}

function proses(){
  let j=jenis.value, s=sumber.value, n=+nominal.value;
  let f=fee(n);
  let now=new Date();
  let tgl=now.toISOString().split("T")[0];

  if(j==="transfer"){ saldo[s]-=n; saldo.cash+=n+f; }
  else{ saldo[s]-=n; saldo.cash-=n; saldo.cash+=f; }

  data.unshift({tgl,waktu:now.toLocaleString(),jenis:j,sumber:s,nominal:n,fee:f});
  localStorage.setItem("data",JSON.stringify(data));
  localStorage.setItem("saldo",JSON.stringify(saldo));
  hasil.innerHTML="Fee: Rp "+f.toLocaleString();
  tampil();
}

function tampil(){
  let today=new Date().toISOString().split("T")[0];
  let total=0, feeTotal=0, count=0;

  riwayat.innerHTML=data.map(d=>{
    if(d.tgl===today){ total+=d.nominal; feeTotal+=d.fee; count++; }
    return `<p>${d.waktu}<br>${d.jenis.toUpperCase()} ${d.sumber} - Rp ${d.nominal.toLocaleString()} | Fee Rp ${d.fee.toLocaleString()}</p><hr>`;
  }).join("");

  rekap.innerHTML=`Transaksi: ${count}<br>Total Nominal: Rp ${total.toLocaleString()}<br>Total Fee: Rp ${feeTotal.toLocaleString()}`;
}

function exportCSV(){
  let csv="Tanggal,Waktu,Jenis,Sumber,Nominal,Fee\n";
  data.forEach(d=>{
    csv+=`${d.tgl},${d.waktu},${d.jenis},${d.sumber},${d.nominal},${d.fee}\n`;
  });
  let blob=new Blob([csv],{type:"text/csv"});
  let a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="rekap-azma-transfer.csv";
  a.click();
}

tampil();
</script>

</body>
</html>
